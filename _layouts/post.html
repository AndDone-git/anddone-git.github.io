---
layout: default
---
<article>
  <div class="meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %B %Y" }}</time>
    {% if page.cve %}<span>{{ page.cve }}</span>{% endif %}
    {% if page.status %}<span class="status" data-state="{{ page.status | downcase }}">{{ page.status | upcase }}</span>{% endif %}
  </div>

  <h1>{{ page.title }}</h1>

  {{ content }}
</article>
