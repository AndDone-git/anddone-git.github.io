<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AndDone · Security research and disclosure</title>
<link rel="icon" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:title" content="AndDone">
<meta property="og:description" content="Security research and disclosure">
<meta property="og:image" content="https://anddone-git.github.io/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">

<body>

<div class="ad-shell">

  <div class="ad-railcol">

      <i style="--w:36px; --c:#132B21"></i>
      <i style="--w:30px; --c:#1C3A2E"></i>
      <i style="--w:26px; --c:#24493A"></i>
      <i style="--w:22px; --c:#2F5D46"></i>
      <i style="--w:18px; --c:#3C6C55"></i>
      <i style="--w:14px; --c:#4E7D67"></i>
      <i style="--w:10px; --c:#628F79"></i>
      <i style="--w:7px;  --c:#7DA692"></i>
      <i style="--w:5px;  --c:#9BBCAB"></i>
    </div>
  </div>

  <main class="ad-post ad-home">

    <header class="ad-masthead">
      <h1 class="ad-wordmark">AndDone</h1>
      <p class="ad-strap">Security research and disclosure</p>
    </header>

    {{ content }}

    <footer class="ad-foot">
      <span>AndDone</span>
      <a href="https://anddone-git.github.io">anddone-git.github.io</a>
    </footer>

  </main>

</div>

<script src="/assets/js/rail.js"></script>
