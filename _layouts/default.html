<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.summary | default: site.description }}">
<link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Spectral:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/favicon-16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/apple-touch-icon.png' | relative_url }}">

<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
<meta property="og:description" content="{{ page.summary | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:image" content="{{ '/og-image.png' | absolute_url }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#2f5d46">
<style>
  :root {
    --paper:  #eff1ef;
    --ink:    #14181a;
    --muted:  #626c6b;
    --rule:   #d3d8d5;
    --accent: #2f5d46;
    --flag:   #9c4a12;

    --serif: Spectral, "Iowan Old Style", Charter, Georgia, serif;
    --mono:  "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 1.0625rem;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 44rem; margin: 0 auto; padding: 0 1.5rem; }

  /* ---- masthead ---- */
  .masthead { border-bottom: 1px solid var(--rule); padding: 2.5rem 0 1.25rem; margin-bottom: 3rem; }
  .masthead a { color: inherit; text-decoration: none; }
  .masthead h1 { font-family: var(--serif); font-size: 1.5rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
  .masthead p { color: var(--muted); font-size: 0.9375rem; margin: 0.4rem 0 0; }

  /* ---- links ---- */
  a { color: var(--accent); text-underline-offset: 0.15em; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }

  /* ---- the ledger: one row per disclosure ---- */
  .ledger { list-style: none; margin: 0; padding: 0; }
  .entry { border-bottom: 1px solid var(--rule); padding: 1.5rem 0; }
  .entry:first-child { border-top: 1px solid var(--rule); }

  .meta {
    font-family: var(--mono);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }
  .status { font-weight: 600; }
  .status[data-state="unpatched"] { color: var(--flag); }
  .status[data-state="fixed"]     { color: var(--accent); }

  .entry h2 { font-size: 1.375rem; line-height: 1.3; font-weight: 600; margin: 0 0 0.35rem; }
  .entry h2 a { color: var(--ink); text-decoration: none; }
  .entry h2 a:hover { color: var(--accent); }
  .entry p { color: var(--muted); margin: 0; font-size: 0.9375rem; }

  .empty { color: var(--muted); font-style: italic; padding: 2rem 0; }

  /* ---- article ---- */
  article h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 0.75rem; }
  article h2 { font-size: 1.375rem; margin: 2.75rem 0 0.75rem; }
  article h3 { font-size: 1.0625rem; margin: 2rem 0 0.5rem; }
  article img { max-width: 100%; height: auto; border: 1px solid var(--rule); }
  article hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
  blockquote { margin: 1.5rem 0; padding-left: 1.25rem; border-left: 2px solid var(--rule); color: var(--muted); }

  code { font-family: var(--mono); font-size: 0.875em; background: #e4e7e4; padding: 0.1em 0.35em; border-radius: 2px; }
  pre { background: var(--ink); color: #e8ecea; padding: 1rem 1.25rem; overflow-x: auto; font-size: 0.8125rem; line-height: 1.55; }
  pre code { background: none; padding: 0; color: inherit; font-size: inherit; }

  table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; margin: 1.5rem 0; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 0.5rem 0.85rem 0.5rem 0; border-bottom: 1px solid var(--rule); }
  th { font-family: var(--mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); font-weight: 600; }

  footer { border-top: 1px solid var(--rule); margin-top: 4rem; padding: 1.5rem 0 3rem; font-family: var(--mono); font-size: 0.75rem; color: var(--muted); }

  @media (max-width: 34rem) { article h1 { font-size: 1.625rem; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <header class="masthead">
    <div class="wrap">
      <a href="{{ '/' | relative_url }}">
        <h1>{{ site.title }}</h1>
        <p>{{ site.tagline }}</p>
      </a>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer>
    <div class="wrap">{{ site.title }}</div>
  </footer>
</body>
</html>
